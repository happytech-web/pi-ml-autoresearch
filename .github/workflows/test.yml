name: Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        if: runner.os == 'Linux'
        run: pnpm test

      - name: Run portable tests
        if: runner.os == 'Windows'
        shell: bash
        run: >-
          pnpm exec vitest run
          --exclude harness/ml/__tests__/local-runner.test.ts
          --exclude harness/ml/__tests__/remote-runner.test.ts
          --exclude harness/ml/__tests__/pty-lease.test.ts

      - name: Smoke test CLI launcher
        run: node harness/pi-autoresearch.mjs --help

      - name: Run tests with coverage
        if: runner.os == 'Linux'
        run: pnpm test:coverage

      - name: Upload coverage
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
